{% extends 'base.html' %}
{% load static %}
{% block title %}Password Changed — SerNest{% endblock %}
{% block content %}
<section class="hero" style="min-height:100vh;align-items:center;justify-content:center">
  <div class="hero-orb hero-orb-1"></div>
  <div class="hero-orb hero-orb-2"></div>

  <div style="width:100%;max-width:440px;position:relative;z-index:2">
    <div style="background:rgba(8,14,30,0.8);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.1);border-radius:24px;padding:44px 40px;box-shadow:0 30px 80px rgba(0,0,0,0.5);text-align:center">

      <div style="font-family:'Syne',sans-serif;font-size:1.8rem;font-weight:800;margin-bottom:24px">
        <span style="color:#4f6ef7">Ser</span>Nest
      </div>

      <div style="width:72px;height:72px;background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 20px">
        ✅
      </div>

      <h1 style="font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:700;margin-bottom:10px;color:#f0f4ff">
        Password changed!
      </h1>
      <p style="color:rgba(240,244,255,0.5);font-size:0.88rem;line-height:1.6;margin-bottom:28px">
        Your password has been updated successfully. You can now sign in with your new password.
      </p>

      <a href="{% url 'core:login' %}" class="btn-primary btn-large"
        style="display:block;text-align:center;border-radius:12px;text-decoration:none">
        Sign In Now →
      </a>
    </div>
  </div>
</section>
{% endblock %}
